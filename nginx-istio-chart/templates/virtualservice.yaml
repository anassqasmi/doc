{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "nginx-istio.fullname" . }}-vs
  labels:
    {{- include "nginx-istio.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.istio.host | quote }}
  gateways:
    - {{ include "nginx-istio.fullname" . }}-gateway
  http:
    - route:
        - destination:
            host: {{ include "nginx-istio.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
