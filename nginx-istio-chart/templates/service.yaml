apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-istio.fullname" . }}
  labels:
    {{- include "nginx-istio.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nginx-istio.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
